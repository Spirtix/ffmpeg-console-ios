name: Build FFmpegKitNext XCFramework (GPL)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ffmpeg-kit-next ref to build'
        default: 'main'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: ${{ inputs.ref }}

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Install host build tools
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja nasm yasm gperf python3 perl ruby

      - name: Build iOS xcframework (GPL enabled)
        run: |
          ./scripts/start-ios.sh -x --spm --enable-gpl \
            --enable-x264 --enable-x265 \
            --disable-armv7 --disable-armv7s --disable-i386

      - name: Upload xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xcframeworks
          path: prebuilt/bundle-apple-xcframework-ios-12.1/
          retention-days: 14
