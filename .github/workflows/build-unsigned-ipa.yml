name: Build unsigned FFmpegConsole IPA

on:
  workflow_dispatch:

jobs:
  build-framework:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          path: ffmpeg-kit-next

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja nasm yasm gperf python3 perl ruby

      - name: Build xcframework
        working-directory: ffmpeg-kit-next
        run: |
          ./ios.sh -x --spm --enable-gpl \
            --enable-x264 --enable-x265 \
            --disable-armv7 --disable-armv7s --disable-i386

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-xcframeworks
          path: ffmpeg-kit-next/prebuilt/bundle-apple-xcframework-ios-12.1/

  build-app:
    needs: build-framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-xcframeworks
          path: ffmpeg-xcframeworks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: App
        run: |
          xcodebuild -project FFmpegConsole.xcodeproj -scheme FFmpegConsole \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package unsigned IPA
        working-directory: App
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          test -n "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../FFmpegConsole-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FFmpegConsole-unsigned-ipa
          path: App/build/FFmpegConsole-unsigned.ipa
